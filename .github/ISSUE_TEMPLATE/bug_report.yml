name: Bug report
description: Something on the site or in the setup doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme and browser
      placeholder: e.g. terminal theme, Safari 18 on iPhone
  - type: textarea
    id: logs
    attributes:
      label: Build or console output
      render: shell
