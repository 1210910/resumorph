name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            content
            style
            refactor
            perf
            docs
            build
            ci
            chore
            revert
          requireScope: false
          # Dependabot writes "Bump x from a to b"; its PRs carry this label.
          ignoreLabels: |
            dependencies
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The summary "{subject}" must start with a lowercase letter, e.g. "feat(now): add platform stack".

  build:
    name: Typecheck, lint and build
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint './src/**/*.{js,jsx,ts,tsx}' --max-warnings=0
      - name: Format
        run: npx prettier --check './src/**/*.{js,jsx,ts,tsx}'
      - name: Build
        run: npx next build
        env:
          # read-only, used to fetch the featured repos' details (src/lib/projects.ts)
          GITHUB_TOKEN: ${{ github.token }}
