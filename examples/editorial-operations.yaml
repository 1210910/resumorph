# Example resume for the editorial theme: an operations director.
# Nora Castell and every company, person and number here are made up.
# Copy what you need into resume.yaml at the root of the repo.

theme: editorial

basics:
  name: Nora Castell
  label: Director of Operations
  email: nora.castell@example.com
  summary: Twelve years running operations for retail and logistics companies. I turn growth plans into teams, processes and numbers that hold up on a Monday morning.
  location:
    city: Lisbon
    country: Portugal
  availability: Open to leadership roles in operations
  profiles:
    - network: LinkedIn
      username: Nora Castell
      url: https://www.linkedin.com/in/your-profile/

about:
  - I started as a shift supervisor in a distribution centre and have spent my career in the gap between strategy and the warehouse floor. Today I run operations for a retail group with 40 stores, two warehouses and 600 people.
  - 'My work is mostly about people and plain numbers: hiring managers who stay, setting three or four measures everyone understands, and fixing the process before buying the software. I have led two acquisitions through integration and one turnaround back to profit.'

stats:
  - value: '12'
    label: years in operations
  - value: '600'
    label: people across my teams
  - value: '€84M'
    label: budget I manage
  - value: '-18%'
    label: cost to serve since 2022

work:
  - name: Corvo Retail Group
    position: Director of Operations
    description: Home and garden retailer · 40 stores · 2 warehouses
    location: Lisbon, Portugal
    startDate: 2021-05
    highlights:
      - '**Integration:** Led the merger of two acquired chains into one network, systems and team in 14 months, on budget.'
      - '**Cost to serve:** Cut it by 18% by redesigning store replenishment and closing an underused warehouse.'
      - '**People:** Built a leadership team of nine; regretted attrition among store managers fell from 22% to 9%.'
      - '**Planning:** Introduced a monthly sales and operations planning cycle shared by finance, buying and stores.'
    keywords: [P&L ownership, S&OP, M&A integration, Change management]
  - name: Halden Freight
    position: Head of Fulfilment
    description: Third-party logistics · 4 sites
    location: Porto, Portugal
    startDate: 2017-02
    endDate: 2021-04
