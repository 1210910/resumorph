      - Ran four fulfilment sites for e-commerce clients, 30,000 orders a day at peak.
      - Took on-time dispatch from 91% to 99.2% with simpler shift patterns and a daily performance huddle.
      - Won and launched three new clients, adding €12M a year in revenue.
    keywords: [Fulfilment, Lean, Vendor management]
  - name: Halden Freight
    position: Site Manager
    location: Porto, Portugal
    startDate: 2014-09
    endDate: 2017-01
    summary: Managed a 180-person distribution site through its move to a new building without missing a client deadline.
