  - name: Operations
    keywords: [Team leadership, Shift planning, Training, Upselling, Budgeting, Housekeeping liaison]
  - name: Systems
    keywords: [Mews, Oracle Opera PMS, SiteMinder, Booking.com Extranet, Revinate, Excel]

