references:
  - name: Rui Teixeira
    position: General Manager
    company: Hotel Ribeira Azul
    reference: Clara is the reason our arrival scores went up. Guests mention her team by name, and she knows every one of them.
  - name: Claire Dubois
    position: Director of Rooms
    company: Quinta do Mar Resort & Spa
    reference: Calm in a full house, generous with her team and relentless about details. I would hire her again tomorrow.

contact:
  headline: Let’s talk about your guests.
  message: References and my phone number are available on request. The quickest way to reach me is email.

titles:
