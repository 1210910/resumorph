      - '**GitOps delivery:** Moved every team to Argo CD and reusable GitHub Actions workflows, from pull request to production.'
      - '**Infrastructure as code:** Maintain Terraform modules for networking, IAM, databases and storage, reviewed through plan diffs.'
    keywords: [Kubernetes, Amazon EKS, Helm, Argo CD, GitHub Actions, Terraform, Go, AWS]
