# Your resume. Everything on the site comes from this file.
#
# - Format: YAML, based on JSON Resume (https://jsonresume.org/schema) with a few extras.
# - Every field is documented in src/content/schema.ts. Optional sections can be removed.
# - Dates are YYYY, YYYY-MM or YYYY-MM-DD. Leave endDate out for your current role.
# - A mistake stops `npm run build` with a list of what to fix.
# - More examples: examples/*.yaml
#
# Alex Morgan is a fictional demo persona: replace everything with your own details.

# terminal: dark and animated, for tech roles · linen: warm and serif, for service roles
theme: terminal

# Light or dark on a visitor's first visit: system (follows their device), light or dark.
# Every theme has a sun/moon button, and the visitor's own choice is remembered.
appearance: dark

basics:
  name: Alex Morgan
  label: Platform Engineer
  initials: am
  handle: alex
  email: alex.morgan@example.com
  summary: Platform Engineer building cloud-native infrastructure that lets product teams ship and run their services with confidence.
  location:
    city: Lisbon
    country: Portugal
  cvFile: Alex-Morgan-CV.pdf
  profiles:
    - network: GitHub
      username: your-username
      url: https://github.com/your-username
    - network: LinkedIn
      username: Alex Morgan
      url: https://www.linkedin.com/in/your-profile/

# Email and phone are kept out of the published HTML and shown when a visitor clicks
# "Show email". This stops simple scrapers. Set to false to show them as plain links.
privacy:
  hideContactDetails: true

about:
  - >-
    Platform Engineer who likes making the right thing the easy thing. I build self-service tooling on
    Kubernetes and AWS so product teams can ship without waiting on tickets, and I care about clear docs,
    boring deploys and good on-call nights. This is a fictional demo persona: replace it with your own story.

now:
  pitch: 'I build the internal platform product teams deploy on: they describe a service once, and the platform builds it, ships it through GitOps to Kubernetes, and provisions the cloud underneath as code.'
  stack:
    - layer: Interface
      role: Teams describe and track services
      tools: [Go, REST APIs, PostgreSQL]
    - layer: Delivery
      role: Builds, releases and rollouts
      tools: [GitHub Actions, Argo CD, Helm]
    - layer: Runtime
      role: Clusters and networking
      tools: [Kubernetes, Amazon EKS, Ingress NGINX]
    - layer: Observability
      role: Metrics, logs and alerts
      tools: [Prometheus, Grafana, Loki]
    - layer: Foundation
      role: Cloud and infrastructure as code
      tools: [AWS, Terraform]
  highlights:
    - title: Self-service platform
      text: A service catalogue that turns one YAML file into a running, monitored service.
      icon: server
    - title: Reliable runtime
      text: Multi-environment Kubernetes clusters with autoscaling and zero-downtime upgrades.
      icon: chip
    - title: GitOps delivery
      text: Argo CD and GitHub Actions take every change from pull request to production.
      icon: cycle
    - title: Infrastructure as code
      text: Reusable Terraform modules for networking, IAM, databases and storage.
      icon: cloud

# Newest first. Consecutive roles at the same company are grouped together.
